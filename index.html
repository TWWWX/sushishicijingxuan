const columnConfig = [
  { count: 64, rowSpan: 1 },
  { count: 32, rowSpan: 2 },
  { count: 16, rowSpan: 4 },
  { count: 8, rowSpan: 8 },
  { count: 4, rowSpan: 16 },
  { count: 2, rowSpan: 32 },
  { count: 1, rowSpan: 64 }
];

const DLC_COLS = 4;
let dlcData = [];
let selectedDlcIdx = null;

const cellData = {};
const fillSourceMap = {};
const fillTargetMap = {};
const colHideContent = [false, false, false, false, false, false, false];

function formatPoemCell(data) {
  if (!data) return '';
  if (typeof data === 'string') {
    return formatPoemString(data);
  }
  return `<span class="poem-title">${escapeHtml(data.title)}</span><span class="poem-content">${escapeHtml(data.content)}</span>`;
}

function formatPoemString(str) {
  str = str.replace(/\r/g, '');
  const lines = str.split('\n').map(l => l.trim()).filter(l => l.length > 0);
  let title = null;
  let content = '';
  
  if (lines.length >= 2) {
    const first = lines[0];
    if (/《.+》/.test(first)) {
      title = first;
      content = lines.slice(1).join('');
    } else {
      const m = lines[0].match(/^(《[^》]+》)[\s:：]*(.*)$/);
      if (m) {
        title = m[1];
        content = (m[2] ? m[2] + ' ' : '') + lines.slice(1).join('');
      } else {
        content = lines.join('');
      }
    }
  } else if (lines.length === 1) {
    const s = lines[0];
    const m = s.match(/^(《[^》]+》)[\s:：]*(.*)$/);
    if (m) {
      title = m[1];
      content = m[2] || '';
    } else {
      const m2 = s.match(/^(.*?)(《[^》]+》)(.*)$/);
      if (m2) {
        title = m2[2];
        content = (m2[1] + m2[3]).replace(/^[\s，,。.:：；;]+/, '');
      } else {
        content = s;
      }
    }
  }
  
  if (title) {
    return `<span class="poem-title">${escapeHtml(title)}</span>` + (content ? `<span class="poem-content">${escapeHtml(content)}</span>` : '');
  }
  return `<span class="poem-content">${escapeHtml(str)}</span>`;
}

function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function getCellKey(col, row) {
  return `${col}-${row}`;
}

function cloneData(data) {
  if (typeof data === 'string') return data;
  return { ...data };
}

function dataEqual(a, b) {
  if (typeof a === 'string' && typeof b === 'string') return a === b;
  if (typeof a === 'object' && typeof b === 'object') {
    return a && b && a.title === b.title && a.content === b.content;
  }
  return false;
}

function applyColHideContentToDom() {
  const tbody = document.getElementById('tableBody');
  const tds = tbody.querySelectorAll('td[data-col]');
  tds.forEach(td => {
    const c = parseInt(td.dataset.col);
    if (colHideContent[c]) {
      td.classList.add('hide-poem-content');
    } else {
      td.classList.remove('hide-poem-content');
    }
  });
  const headerRow = document.getElementById('headerRow');
  headerRow.querySelectorAll('th').forEach(th => {
    const c = parseInt(th.dataset.col);
    if (colHideContent[c]) {
      th.classList.add('hide-col');
    } else {
      th.classList.remove('hide-col');
    }
  });
}

function buildTable() {
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';
  
  for (let row = 0; row < 64; row++) {
    const tr = document.createElement('tr');
    for (let col = 0; col < 7; col++) {
      const cfg = columnConfig[col];
      const rowInCol = Math.floor(row / cfg.rowSpan);
      const isFirstRowOfCell = (row % cfg.rowSpan) === 0;
      
      if (isFirstRowOfCell) {
        const td = document.createElement('td');
        const key = getCellKey(col, rowInCol);
        td.dataset.key = key;
        td.dataset.col = col;
        td.dataset.rowInCol = rowInCol;
        
        if (col === 0) td.classList.add('col-0');
        if (col === 1) td.classList.add('col-1');
        if (col === 6) td.classList.add('champion-cell');
        
        if (col === 0) {
          const poem = poemsData[rowInCol];
          cellData[key] = { title: poem.title, content: poem.content };
          td.innerHTML = formatPoemCell(cellData[key]);
        } else {
          if (cellData[key]) {
            td.innerHTML = formatPoemCell(cellData[key]);
          } else {
            td.classList.add('empty');
            td.innerHTML = '&nbsp;';
          }
        }
        
        td.rowSpan = cfg.rowSpan;
        td.addEventListener('click', handleCellClick);
        td.addEventListener('dblclick', handleCellDblClick);
        tr.appendChild(td);
      }
    }
    tbody.appendChild(tr);
  }
  applyColHideContentToDom();
  refreshAllSourceStyles();
}

function refreshSourceStyle(key) {
  const tds = document.querySelectorAll(`td[data-key="${key}"]`);
  if (fillTargetMap[key] && Object.keys(fillTargetMap[key]).length > 0) {
    tds.forEach(td => td.classList.add('source-cell'));
  } else {
    tds.forEach(td => td.classList.remove('source-cell'));
  }
}

function refreshAllSourceStyles() {
  document.querySelectorAll('td[data-key]').forEach(td => {
    refreshSourceStyle(td.dataset.key);
  });
}

function detachFromSource(targetKey) {
  const oldSourceKey = fillSourceMap[targetKey];
  if (oldSourceKey && fillTargetMap[oldSourceKey]) {
    delete fillTargetMap[oldSourceKey][targetKey];
    refreshSourceStyle(oldSourceKey);
    propagateDown(oldSourceKey);
  }
  delete fillSourceMap[targetKey];
}

function attachToSource(sourceKey, targetKey) {
  detachFromSource(targetKey);
  fillSourceMap[targetKey] = sourceKey;
  if (!fillTargetMap[sourceKey]) fillTargetMap[sourceKey] = {};
  fillTargetMap[sourceKey][targetKey] = true;
  refreshSourceStyle(sourceKey);
}

function propagateDown(sourceKey) {
  const targets = fillTargetMap[sourceKey];
  if (!targets) return;
  Object.keys(targets).forEach(targetKey => {
    if (cellData[sourceKey] !== undefined) {
      const oldVal = cellData[targetKey];
      const newVal = cloneData(cellData[sourceKey]);
      if (!dataEqual(oldVal, newVal)) {
        cellData[targetKey] = newVal;
        const tds = document.querySelectorAll(`td[data-key="${targetKey}"]`);
        tds.forEach(td => {
          td.innerHTML = formatPoemCell(cellData[targetKey]);
          td.classList.remove('empty');
        });
        propagateDown(targetKey);
      }
    }
  });
}

function updateCellDom(key) {
  const tds = document.querySelectorAll(`td[data-key="${key}"]`);
  tds.forEach(td => {
    if (cellData[key] !== undefined) {
      td.innerHTML = formatPoemCell(cellData[key]);
      td.classList.remove('empty');
    } else {
      td.innerHTML = '&nbsp;';
      td.classList.add('empty');
    }
  });
}

let _justFinishedEdit = 0;

function handleCellClick(e) {
  if (_justFinishedEdit > 0) {
    _justFinishedEdit--;
    return;
  }
  const td = e.currentTarget;
  if (td.getAttribute('contenteditable') === 'true') return;
  
  const col = parseInt(td.dataset.col);
  const rowInCol = parseInt(td.dataset.rowInCol);
  const key = td.dataset.key;
  
  if (col === 0 && selectedDlcIdx !== null && selectedDlcIdx >= 0 && selectedDlcIdx < dlcData.length) {
    const mainCurrent = cellData[key] ? cloneData(cellData[key]) : null;
    const dlcCurrent = cloneData(dlcData[selectedDlcIdx]);
    
    if (typeof mainCurrent === 'object' && mainCurrent.title !== undefined) {
      dlcData[selectedDlcIdx] = { title: mainCurrent.title, content: mainCurrent.content || '' };
    } else if (typeof mainCurrent === 'string') {
      const parsed = parsePlainToPoem(mainCurrent);
      dlcData[selectedDlcIdx] = parsed;
    } else {
      dlcData[selectedDlcIdx] = { title: '', content: '' };
    }
    
    cellData[key] = { title: dlcCurrent.title, content: dlcCurrent.content };
    
    updateCellDom(key);
    detachFromSource(key);
    propagateDown(key);
    refreshSourceStyle(key);
    refreshAllSourceStyles();
    
    renderDlcTable();
    selectedDlcIdx = null;
    return;
  }
  
  if (cellData[key] === undefined) return;
  if (col >= 6) return;
  
  const nextCol = col + 1;
  const nextCfg = columnConfig[nextCol];
  const nextRowInCol = Math.floor(rowInCol / 2);
  const targetKey = getCellKey(nextCol, nextRowInCol);
  
  attachToSource(key, targetKey);
  
  cellData[targetKey] = cloneData(cellData[key]);
  updateCellDom(targetKey);
  
  propagateDown(targetKey);
}

function parsePlainToPoem(str) {
  if (!str) return { title: '', content: '' };
  str = str.replace(/\r/g, '').trim();
  const lines = str.split('\n').map(l => l.trim()).filter(l => l.length > 0);
  let title = null, content = '';
  if (lines.length >= 2 && /《.+》/.test(lines[0])) {
    title = lines[0]; content = lines.slice(1).join('');
  } else if (lines.length === 1) {
    const m = lines[0].match(/^(《[^》]+》)[\s:：]*(.*)$/);
    if (m) { title = m[1]; content = m[2] || ''; }
    else { content = lines[0]; }
  } else {
    content = lines.join(' ');
  }
  return { title: title || '', content: content };
}

function handleCellDblClick(e) {
  e.preventDefault();
  const td = e.currentTarget;
  const key = td.dataset.key;
  
  td.setAttribute('contenteditable', 'true');
  td.classList.remove('empty');
  
  const currentData = cellData[key];
  if (currentData) {
    if (typeof currentData === 'string') {
      td.textContent = currentData;
    } else {
      td.textContent = currentData.title + '\n' + currentData.content;
    }
  } else {
    td.textContent = '';
  }
  
  td.focus();
  document.execCommand('selectAll', false, null);
  
  function finishEdit(trigger) {
    td.removeAttribute('contenteditable');
    const text = td.innerText.trim();
    const oldVal = cellData[key];
    
    if (text) {
      cellData[key] = text;
    } else {
      delete cellData[key];
    }
    
    const newVal = cellData[key];
    const changed = !dataEqual(oldVal, newVal);
    
    updateCellDom(key);
    applyColHideContentToDom();
    
    if (changed) {
      detachFromSource(key);
      propagateDown(key);
    }
    
    if (trigger === 'blur') {
      _justFinishedEdit = 1;
      setTimeout(() => { _justFinishedEdit = 0; }, 0);
    }
    
    td.removeEventListener('blur', handleBlur);
    td.removeEventListener('keydown', handleKey);
  }
  
  function handleBlur() { finishEdit('blur'); }
  
  function handleKey(ev) {
    if (ev.key === 'Enter' && !ev.shiftKey) {
      ev.preventDefault();
      finishEdit('enter');
    }
    if (ev.key === 'Escape') {
      ev.preventDefault();
      finishEdit('escape');
    }
  }
  
  setTimeout(() => {
    td.addEventListener('blur', handleBlur);
    td.addEventListener('keydown', handleKey);
  }, 0);
}

function handleHeaderDblClick(e) {
  const th = e.currentTarget;
  const col = parseInt(th.dataset.col);
  if (isNaN(col)) return;
  colHideContent[col] = !colHideContent[col];
  applyColHideContentToDom();
}

function exportCSV() {
  const rows = [];
  const header = ['64篇苏轼诗文', '32强', '16强', '8强', '4强', '2强', '冠军'];
  rows.push(header);
  
  for (let r = 0; r < 64; r++) {
    const row = [];
    for (let c = 0; c < 7; c++) {
      const cfg = columnConfig[c];
      const rowInCol = Math.floor(r / cfg.rowSpan);
      const key = getCellKey(c, rowInCol);
      const isFirst = (r % cfg.rowSpan) === 0;
      
      if (isFirst && cellData[key] !== undefined) {
        const data = cellData[key];
        if (typeof data === 'string') {
          row.push(data.replace(/\n/g, ' '));
        } else {
          row.push(data.title + ' ' + data.content);
        }
      } else {
        row.push('');
      }
    }
    rows.push(row);
  }
  
  const csvContent = '\uFEFF' + rows.map(row => 
    row.map(cell => {
      if (cell === null || cell === undefined) return '""';
      const s = String(cell);
      if (s.includes(',') || s.includes('"') || s.includes('\n')) {
        return '"' + s.replace(/"/g, '""') + '"';
      }
      return s;
    }).join(',')
  ).join('\r\n');
  
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = '苏轼诗文作品64选1_' + formatDate() + '.csv';
  link.click();
  URL.revokeObjectURL(link.href);
}

function formatDate() {
  const d = new Date();
  return d.getFullYear() + 
    String(d.getMonth()+1).padStart(2,'0') + 
    String(d.getDate()).padStart(2,'0') + '_' +
    String(d.getHours()).padStart(2,'0') + 
    String(d.getMinutes()).padStart(2,'0');
}

function parseDlcText(raw) {
  raw = raw.replace(/\r/g, '').replace(/\u200c/g, '').replace(/\u200b/g, '').replace(/\ufeff/g, '').trim();
  const result = [];
  const lines = raw.split('\n').map(l => l.trim()).filter(l => l.length > 0);
  for (let i = 0; i < lines.length; i++) {
    let line = lines[i];
    line = line.replace(/^"+/, '').replace(/"+$/, '').trim();
    if (/^《[^》]+》/.test(line)) {
      let title = line;
      let content = '';
      const nextIdx = i + 1;
      if (nextIdx < lines.length) {
        let next = lines[nextIdx].replace(/^"+/, '').replace(/"+$/, '').trim();
        if (!/^《/.test(next)) {
          content = next;
          i = nextIdx;
        }
      }
      result.push({ title: title, content: content });
    } else if (line.length > 0) {
      let next = '';
      const nextIdx = i + 1;
      if (nextIdx < lines.length && !/^《/.test(lines[nextIdx])) {
        next = lines[nextIdx].replace(/^"+/, '').replace(/"+$/, '').trim();
        i = nextIdx;
      }
      result.push({ title: '', content: line + (next ? ' ' + next : '') });
    }
  }
  return result;
}

    }
    tbody.appendChild(tr);
  }
}

function selectDlc(idx) {
  if (idx < 0 || idx >= dlcData.length) return;
  selectedDlcIdx = (selectedDlcIdx === idx) ? null : idx;
  
  const oldHighlight = document.querySelector('#tournamentTable td.dlc-selected-col');
  if (oldHighlight) oldHighlight.classList.remove('dlc-selected-col');
  if (selectedDlcIdx !== null) {
    document.querySelectorAll('#tournamentTable td.col-0').forEach(td => {
      td.classList.add('dlc-selected-col');
    });
  }
  
  const allTds = document.querySelectorAll('#dlcTable td[data-dlc-idx]');
  allTds.forEach(td => {
    const i = parseInt(td.dataset.dlcIdx);
    if (i === selectedDlcIdx) {
      td.classList.add('selected');
    } else {
      td.classList.remove('selected');
    }
  });
}

document.getElementById('headerRow').querySelectorAll('th').forEach(th => {
  th.addEventListener('dblclick', handleHeaderDblClick);
});

(async function init() {
  buildTable();
  await loadDlcFile();
  renderDlcTable();
})();
</script>
</body>
</html>
