const columnConfig = [
  { count: 64, rowSpan: 1 },
  { count: 32, rowSpan: 2 },
  { count: 16, rowSpan: 4 },
  { count: 8, rowSpan: 8 },
  { count: 4, rowSpan: 16 },
  { count: 2, rowSpan: 32 },
  { count: 1, rowSpan: 64 }
];

const cellData = {};
const fillSourceMap = {};
const fillTargetMap = {};

function formatPoemCell(data) {
  if (!data) return '';
  if (typeof data === 'string') {
    return formatPoemString(data);
  }
  return `<span class="poem-title">${escapeHtml(data.title)}</span><span class="poem-content">${escapeHtml(data.content)}</span>`;
}

function formatPoemString(str) {
  str = str.replace(/\r/g, '');
  const lines = str.split('\n').map(l => l.trim()).filter(l => l.length > 0);
  let title = null;
  let content = '';
  
  if (lines.length >= 2) {
    const first = lines[0];
    if (/《.+》/.test(first)) {
      title = first;
      content = lines.slice(1).join('');
    } else {
      const m = lines[0].match(/^(《[^》]+》)[\s:：]*(.*)$/);
      if (m) {
        title = m[1];
        content = (m[2] ? m[2] + ' ' : '') + lines.slice(1).join('');
      } else {
        content = lines.join('');
      }
    }
  } else if (lines.length === 1) {
    const s = lines[0];
    const m = s.match(/^(《[^》]+》)[\s:：]*(.*)$/);
    if (m) {
      title = m[1];
      content = m[2] || '';
    } else {
      const m2 = s.match(/^(.*?)(《[^》]+》)(.*)$/);
      if (m2) {
        title = m2[2];
        content = (m2[1] + m2[3]).replace(/^[\s，,。.:：；;]+/, '');
      } else {
        content = s;
      }
    }
  }
  
  if (title) {
    return `<span class="poem-title">${escapeHtml(title)}</span>` + (content ? `<span class="poem-content">${escapeHtml(content)}</span>` : '');
  }
  return `<span class="poem-content">${escapeHtml(str)}</span>`;
}

function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function getCellKey(col, row) {
  return `${col}-${row}`;
}

function cloneData(data) {
  if (typeof data === 'string') return data;
  return { ...data };
}

function dataEqual(a, b) {
  if (typeof a === 'string' && typeof b === 'string') return a === b;
  if (typeof a === 'object' && typeof b === 'object') {
    return a && b && a.title === b.title && a.content === b.content;
  }
  return false;
}

function buildTable() {
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';
  
  for (let row = 0; row < 64; row++) {
    const tr = document.createElement('tr');
    for (let col = 0; col < 7; col++) {
      const cfg = columnConfig[col];
      const rowInCol = Math.floor(row / cfg.rowSpan);
      const isFirstRowOfCell = (row % cfg.rowSpan) === 0;
      
      if (isFirstRowOfCell) {
        const td = document.createElement('td');
        const key = getCellKey(col, rowInCol);
        td.dataset.key = key;
        td.dataset.col = col;
        td.dataset.rowInCol = rowInCol;
        
        if (col === 0) td.classList.add('col-0');
        if (col === 6) td.classList.add('champion-cell');
        
        if (col === 0) {
          const poem = poemsData[rowInCol];
          cellData[key] = { title: poem.title, content: poem.content };
          td.innerHTML = formatPoemCell(cellData[key]);
        } else {
          if (cellData[key]) {
            td.innerHTML = formatPoemCell(cellData[key]);
          } else {
            td.classList.add('empty');
            td.innerHTML = '&nbsp;';
          }
        }
        
        td.rowSpan = cfg.rowSpan;
        td.addEventListener('click', handleCellClick);
        td.addEventListener('dblclick', handleCellDblClick);
        tr.appendChild(td);
      }
    }
    tbody.appendChild(tr);
  }
  refreshAllSourceStyles();
}

function refreshSourceStyle(key) {
  const tds = document.querySelectorAll(`td[data-key="${key}"]`);
  if (fillTargetMap[key] && Object.keys(fillTargetMap[key]).length > 0) {
    tds.forEach(td => td.classList.add('source-cell'));
  } else {
    tds.forEach(td => td.classList.remove('source-cell'));
  }
}

function refreshAllSourceStyles() {
  document.querySelectorAll('td[data-key]').forEach(td => {
    refreshSourceStyle(td.dataset.key);
  });
}

function detachFromSource(targetKey) {
  const oldSourceKey = fillSourceMap[targetKey];
  if (oldSourceKey && fillTargetMap[oldSourceKey]) {
    delete fillTargetMap[oldSourceKey][targetKey];
    refreshSourceStyle(oldSourceKey);
    propagateDown(oldSourceKey);
  }
  delete fillSourceMap[targetKey];
}

function attachToSource(sourceKey, targetKey) {
  detachFromSource(targetKey);
  fillSourceMap[targetKey] = sourceKey;
  if (!fillTargetMap[sourceKey]) fillTargetMap[sourceKey] = {};
  fillTargetMap[sourceKey][targetKey] = true;
  refreshSourceStyle(sourceKey);
}

function propagateDown(sourceKey) {
  const targets = fillTargetMap[sourceKey];
  if (!targets) return;
  Object.keys(targets).forEach(targetKey => {
    if (cellData[sourceKey] !== undefined) {
      const oldVal = cellData[targetKey];
      const newVal = cloneData(cellData[sourceKey]);
      if (!dataEqual(oldVal, newVal)) {
        cellData[targetKey] = newVal;
        const tds = document.querySelectorAll(`td[data-key="${targetKey}"]`);
        tds.forEach(td => {
          td.innerHTML = formatPoemCell(cellData[targetKey]);
          td.classList.remove('empty');
        });
        propagateDown(targetKey);
      }
    }
  });
}

function updateCellDom(key) {
  const tds = document.querySelectorAll(`td[data-key="${key}"]`);
  tds.forEach(td => {
    if (cellData[key] !== undefined) {
      td.innerHTML = formatPoemCell(cellData[key]);
      td.classList.remove('empty');
    } else {
      td.innerHTML = '&nbsp;';
      td.classList.add('empty');
    }
  });
}

function handleCellClick(e) {
  const td = e.currentTarget;
  if (td.getAttribute('contenteditable') === 'true') return;
  
  const col = parseInt(td.dataset.col);
  const rowInCol = parseInt(td.dataset.rowInCol);
  const sourceKey = td.dataset.key;
  
  if (cellData[sourceKey] === undefined) return;
  if (col >= 6) return;
  
  const nextCol = col + 1;
  const nextCfg = columnConfig[nextCol];
  const nextRowInCol = Math.floor(rowInCol / 2);
  const targetKey = getCellKey(nextCol, nextRowInCol);
  
  attachToSource(sourceKey, targetKey);
  
  cellData[targetKey] = cloneData(cellData[sourceKey]);
  updateCellDom(targetKey);
  
  propagateDown(targetKey);
}

function handleCellDblClick(e) {
  e.preventDefault();
  const td = e.currentTarget;
  const key = td.dataset.key;
  
  td.setAttribute('contenteditable', 'true');
  td.classList.remove('empty');
  
  const currentData = cellData[key];
  if (currentData) {
    if (typeof currentData === 'string') {
      td.textContent = currentData;
    } else {
      td.textContent = currentData.title + '\n' + currentData.content;
    }
  } else {
    td.textContent = '';
  }
  
  td.focus();
  document.execCommand('selectAll', false, null);
  
  function finishEdit() {
    td.removeAttribute('contenteditable');
    const text = td.innerText.trim();
    const oldVal = cellData[key];
    
    if (text) {
      cellData[key] = text;
    } else {
      delete cellData[key];
    }
    
    const newVal = cellData[key];
    const changed = !dataEqual(oldVal, newVal);
    
    updateCellDom(key);
    
    if (changed) {
      detachFromSource(key);
      propagateDown(key);
    }
    
    td.removeEventListener('blur', finishEdit);
    td.removeEventListener('keydown', handleKey);
  }
  
  function handleKey(ev) {
    if (ev.key === 'Enter' && !ev.shiftKey) {
      ev.preventDefault();
      finishEdit();
    }
    if (ev.key === 'Escape') {
      ev.preventDefault();
      finishEdit();
    }
  }
  
  setTimeout(() => {
    td.addEventListener('blur', finishEdit);
    td.addEventListener('keydown', handleKey);
  }, 0);
}

function exportCSV() {
  const rows = [];
  const header = ['64句苏轼诗文', '32强', '16强', '8强', '4强', '2强', '冠军'];
  rows.push(header);
  
  for (let r = 0; r < 64; r++) {
    const row = [];
    for (let c = 0; c < 7; c++) {
      const cfg = columnConfig[c];
      const rowInCol = Math.floor(r / cfg.rowSpan);
      const key = getCellKey(c, rowInCol);
      const isFirst = (r % cfg.rowSpan) === 0;
      
      if (isFirst && cellData[key] !== undefined) {
        const data = cellData[key];
        if (typeof data === 'string') {
          row.push(data.replace(/\n/g, ' '));
        } else {
          row.push(data.title + ' ' + data.content);
        }
      } else {
        row.push('');
      }
    }
    rows.push(row);
  }
  
  const csvContent = '\uFEFF' + rows.map(row => 
    row.map(cell => {
      if (cell === null || cell === undefined) return '""';
      const s = String(cell);
      if (s.includes(',') || s.includes('"') || s.includes('\n')) {
        return '"' + s.replace(/"/g, '""') + '"';
      }
      return s;
    }).join(',')
  ).join('\r\n');
  
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = '苏轼诗文64选1_' + formatDate() + '.csv';
  link.click();
  URL.revokeObjectURL(link.href);
}

function resetTable() {
  if (!confirm('确定要清空表格并恢复初始状态吗？第一列的64首诗文将恢复原文，其他列将全部清空。')) return;
  
  Object.keys(cellData).forEach(key => delete cellData[key]);
  Object.keys(fillSourceMap).forEach(k => delete fillSourceMap[k]);
  Object.keys(fillTargetMap).forEach(k => delete fillTargetMap[k]);
  
  for (let i = 0; i < 64; i++) {
    const key = getCellKey(0, i);
    const poem = poemsData[i];
    cellData[key] = { title: poem.title, content: poem.content };
  }
  
  buildTable();
}

function formatDate() {
  const d = new Date();
  return d.getFullYear() + 
    String(d.getMonth()+1).padStart(2,'0') + 
    String(d.getDate()).padStart(2,'0') + '_' +
    String(d.getHours()).padStart(2,'0') + 
    String(d.getMinutes()).padStart(2,'0');
}

function showLoading(text) {
  document.getElementById('loadingText').textContent = text || '处理中...';
  document.getElementById('loadingMask').classList.add('active');
}

function hideLoading() {
  document.getElementById('loadingMask').classList.remove('active');
}
